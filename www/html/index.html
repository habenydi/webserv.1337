<!DOCTYPE html>
<html lang="en" class="dark">

    <script>
      tailwind.config = {

    <style>
      @keyframes float {
        0%,

        }

          transform: translateY(-20px);

      .float-animation {
        animation: float 6s ease-in-out infinite;

          <!-- Desktop Menu -->
          <div class="hidden md:flex gap-8 items-center">
            <a

              class="text-gray-600 dark:text-gray-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition font-medium nav-link"

            <a
              href="/team.html"
              class="text-gray-600 dark:text-gray-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition font-medium nav-link"

            <!-- explore button -->

            <!-- Theme Toggle Button -->

                <path

          <!-- Mobile Menu Button -->

            >
              <svg
                class="w-5 h-5 text-gray-600 dark:text-gray-400 hidden dark:block"
                fill="currentColor"

              >
                <path
                  d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"

              </svg>
              <svg
                class="w-5 h-5 text-yellow-500 block dark:hidden"

                viewBox="0 0 20 20"

                <path
                  fill-rule="evenodd"
                  d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"

            <button
              id="mobile-menu-button"
              class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800/50 hover:bg-gray-300 dark:hover:bg-gray-700/50 transition-colors duration-300"
              aria-label="Toggle menu"
            >
              <svg
                id="menu-open-icon"
                class="w-6 h-6 text-gray-900 dark:text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path

                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                ></path>
              </svg>
              <svg
                id="menu-close-icon"
                class="w-6 h-6 text-gray-900 dark:text-white hidden"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                ></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden pt-4 pb-3 space-y-3">
          <a
            href="/"
            class="block px-4 py-2 text-gray-600 dark:text-gray-400 hover:text-cyan-600 dark:hover:text-cyan-400 hover:bg-gray-100 dark:hover:bg-gray-800/50 rounded-lg transition font-medium nav-link-mobile"
            >Home</a
          >
          <a
            href="/team.html"
            class="block px-4 py-2 text-gray-600 dark:text-gray-400 hover:text-cyan-600 dark:hover:text-cyan-400 hover:bg-gray-100 dark:hover:bg-gray-800/50 rounded-lg transition font-medium nav-link-mobile"
            >Team</a
          >
          <a
            href="/explore.html"
            class="block px-4 py-2 text-gray-600 dark:text-gray-400 hover:text-cyan-600 dark:hover:text-cyan-400 hover:bg-gray-100 dark:hover:bg-gray-800/50 rounded-lg transition font-medium nav-link-mobile"
            >Explore</a
          >
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <section
      class="min-h-screen flex items-center justify-center px-6 pt-20 relative overflow-hidden"
    >
      <!-- Gradient Orbs -->
      <div
        class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-200/40 dark:bg-cyan-500/20 rounded-full blur-3xl transition-colors duration-300"
      ></div>
      <div
        class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-200/40 dark:bg-blue-500/20 rounded-full blur-3xl transition-colors duration-300"
      ></div>

      <div class="max-w-6xl mx-auto text-center relative z-10">
        <div class="mb-8">
          <span
            class="px-6 py-2 bg-cyan-100 dark:bg-cyan-500/10 border border-cyan-300 dark:border-cyan-500/30 text-cyan-700 dark:text-cyan-400 rounded-full text-sm font-mono inline-block transition-colors duration-300"
          >
            <span class="text-cyan-600 dark:text-cyan-300">●</span> System
            Online
          </span>
        </div>

        <h1 class="text-7xl md:text-9xl font-black mb-8 leading-none">
          <span
            class="text-gray-900 dark:text-white drop-shadow-lg transition-colors duration-300"
            >SHLO7</span
          >
          <span
            class="bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 bg-clip-text text-transparent drop-shadow-2xl"
          >
            SERV
          </span>
        </h1>

        <div class="max-w-3xl mx-auto mb-12">
          <p
            class="text-2xl text-gray-600 dark:text-gray-400 mb-4 font-light transition-colors duration-300"
          >
            High-Performance HTTP Server
          </p>
          <p
            class="text-lg text-gray-700 dark:text-gray-500 transition-colors duration-300"
          >
            Built with C++98 • Non-blocking I/O • Full HTTP/1.0 Support
          </p>
        </div>

        <div class="flex gap-6 justify-center flex-wrap mb-20">
          <a
            href="/explore.html"
            class="group px-10 py-5 bg-gradient-to-r from-cyan-500 to-blue-500 text-white rounded-2xl font-black text-lg glow hover:scale-105 transition"
          >
            EXPLORE
            <span
              class="inline-block ml-2 group-hover:translate-x-2 transition-transform"
              >→</span
            >
          </a>
          <a
            href="https://github.com/BH267/webserv.1337"
            target="_blank"
            class="px-10 py-5 bg-white dark:bg-gray-900 border-2 border-gray-300 dark:border-cyan-500/30 text-gray-900 dark:text-white rounded-2xl font-black text-lg hover:bg-gray-50 dark:hover:border-cyan-500/50 dark:hover:bg-gray-800 transition"
          >
            GITHUB
          </a>
        </div>

        <!-- Floating Cards -->
        <div class="grid md:grid-cols-4 gap-6">
          <div
            class="float-animation bg-gradient-to-br from-cyan-500/10 to-transparent border border-cyan-500/20 rounded-2xl p-6 backdrop-blur-sm transition-colors duration-300"
            style="animation-delay: 0s"
          >
            <div
              class="text-4xl font-black bg-gradient-to-br from-cyan-400 to-cyan-600 bg-clip-text text-transparent mb-2"
            >
              1337
            </div>
            <div
              class="text-gray-600 dark:text-gray-500 text-sm font-medium transition-colors duration-300"
            >
              SCHOOL
            </div>
          </div>
          <div
            class="float-animation bg-gradient-to-br from-blue-500/10 to-transparent border border-blue-500/20 rounded-2xl p-6 backdrop-blur-sm transition-colors duration-300"
            style="animation-delay: 0.5s"
          >
            <div
              class="text-4xl font-black bg-gradient-to-br from-blue-400 to-blue-600 bg-clip-text text-transparent mb-2"
            >
              C++98
            </div>
            <div
              class="text-gray-600 dark:text-gray-500 text-sm font-medium transition-colors duration-300"
            >
              STANDARD
            </div>
          </div>
          <div
            class="float-animation bg-gradient-to-br from-purple-500/10 to-transparent border border-purple-500/20 rounded-2xl p-6 backdrop-blur-sm transition-colors duration-300"
            style="animation-delay: 1s"
          >
            <div
              class="text-4xl font-black bg-gradient-to-br from-purple-400 to-purple-600 bg-clip-text text-transparent mb-2"
            >
              HTTP
            </div>
            <div
              class="text-gray-600 dark:text-gray-500 text-sm font-medium transition-colors duration-300"
            >
              PROTOCOL
            </div>
          </div>
          <div
            class="float-animation bg-gradient-to-br from-pink-500/10 to-transparent border border-pink-500/20 rounded-2xl p-6 backdrop-blur-sm transition-colors duration-300"
            style="animation-delay: 1.5s"
          >
            <div
              class="text-4xl font-black bg-gradient-to-br from-pink-400 to-pink-600 bg-clip-text text-transparent mb-2"
            >
              3
            </div>
            <div
              class="text-gray-600 dark:text-gray-500 text-sm font-medium transition-colors duration-300"
            >
              DEVELOPERS
            </div>
          </div>
        </div>
      </div>
    </section>

    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const themeToggleMobile = document.getElementById("theme-toggle-mobile");
      const htmlElement = document.documentElement;

      const currentTheme = localStorage.getItem("theme") || "dark";
      if (currentTheme === "dark") {
        htmlElement.classList.add("dark");
      } else {
        htmlElement.classList.remove("dark");
      }

      function toggleTheme() {
        htmlElement.classList.toggle("dark");
        const theme = htmlElement.classList.contains("dark") ? "dark" : "light";
        localStorage.setItem("theme", theme);
      }

      themeToggle.addEventListener("click", toggleTheme);
      themeToggleMobile.addEventListener("click", toggleTheme);

      const mobileMenuButton = document.getElementById("mobile-menu-button");
      const mobileMenu = document.getElementById("mobile-menu");
      const menuOpenIcon = document.getElementById("menu-open-icon");
      const menuCloseIcon = document.getElementById("menu-close-icon");

      mobileMenuButton.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
        menuOpenIcon.classList.toggle("hidden");
        menuCloseIcon.classList.toggle("hidden");
      });

      const mobileLinks = document.querySelectorAll(".nav-link-mobile");
      mobileLinks.forEach((link) => {
        link.addEventListener("click", () => {
          mobileMenu.classList.add("hidden");
          menuOpenIcon.classList.remove("hidden");
          menuCloseIcon.classList.add("hidden");
        });
      });

      const links = document.querySelectorAll(".nav-link");
      links.forEach((link) => {
        if (link.href === window.location.href) {
          link.classList.add(
            "text-cyan-600",
            "font-bold",
            "border-b-2",
            "border-cyan-600"
          );
        }
      });
    </script>
  </body>
</html>
