<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign In - Welcome Back</title>

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: "#1E40AF",
          },
        },
      },
    };
  </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
  <div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="container mx-auto max-w-6xl">
      <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
        <div class="grid md:grid-cols-2 gap-8 items-center">
          <div class="p-8 md:p-12 lg:p-16">
            <!-- button back to home -->
            <a href="/index.html" class="inline-block mb-6 text-brand hover:text-blue-700 font-semibold">
              &larr; Back to Home
            </a>
            <div class="mb-10">
              <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-3">
                Welcome back!
              </h1>
              <p class="text-gray-600 text-lg">
                Sign in to continue to your account
              </p>
            </div>

            <form action="profile" method="POST" class="space-y-6">
              <div class="space-y-2">
                <label for="email" class="block text-sm font-semibold text-gray-700">
                  Email Address <span class="text-red-500">*</span>
                </label>
                <input type="email" id="email" name="email" required placeholder="you@example.com"
                  class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition duration-200 hover:border-gray-300" />
              </div>

              <div class="space-y-2">
                <div class="flex items-center justify-between">
                  <label for="password" class="block text-sm font-semibold text-gray-700">
                    Password <span class="text-red-500">*</span>
                  </label>
                  <a href="#" class="text-sm text-brand hover:text-blue-700 font-medium">
                    Forgot password?
                  </a>
                </div>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                  class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition duration-200 hover:border-gray-300" />
              </div>

              <div class="flex items-center">
                <input type="checkbox" id="remember" name="remember"
                  class="h-4 w-4 text-brand focus:ring-brand border-gray-300 rounded" />
                <label for="remember" class="ml-2 block text-sm text-gray-700">
                  Remember me for 30 days
                </label>
              </div>

              <button type="submit"
                class="w-full py-3.5 px-4 bg-brand hover:bg-blue-700 text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition duration-200 focus:outline-none focus:ring-4 focus:ring-blue-300">
                  Sign In

              </button>

              <p class="text-center text-sm text-gray-600 mt-6">
                Don't have an account?
                <a href="#" class="text-brand hover:text-blue-700 font-semibold">
                  Sign up for free
                </a>
              </p>
            </form>
          </div>

          <div class="hidden md:flex bg-gradient-to-br from-blue-500 to-indigo-600 p-12 items-center justify-center">
            <div class="text-center">
              <img src="/images/login2.png" alt="Welcome Image" class="mx-auto w-full h-full object-contain" />
              <div class="mt-8 text-white">
                <h2 class="text-2xl font-bold mb-2">Start your journey</h2>
                <p class="text-blue-100">
                  Access your dashboard and manage everything in one place
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
