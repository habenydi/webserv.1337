<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 - Forbidden | Shlo7serv 1337</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",

    </script>
    <style>
      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
      }
      @keyframes glitch {
        0% {
          transform: translate(0);
        }
        20% {
          transform: translate(-2px, 2px);
        }
        40% {
          transform: translate(-2px, -2px);
        }
        60% {
          transform: translate(2px, 2px);
        }
        80% {
          transform: translate(2px, -2px);
        }
        100% {
          transform: translate(0);
        }
      }
      @keyframes pulse-glow {
        0%,
        100% {
          box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
        }
        50% {
          box-shadow: 0 0 40px rgba(6, 182, 212, 0.6);
        }
      }
      .float-animation {
        animation: float 6s ease-in-out infinite;
      }
      .glitch {
        animation: glitch 0.3s infinite;
      }
      .glow {
        box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
      }
      .pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 transition-colors duration-300">

    <!-- Navbar -->
    <nav

    >
      <div class="max-w-7xl mx-auto px-6 py-4">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 bg-gradient-to-br from-cyan-400 to-blue-500 rounded-lg glow"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"

                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"

                <path

                />
              </svg>

            <a

              >SHLO7SERV</a
            >
          </div>

          <!-- Desktop Menu -->
          <div class="hidden md:flex gap-8 items-center">
            <a
              href="/"
              class="text-gray-600 dark:text-gray-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition font-medium"

            >
            <a
              href="/html/team.html"
              class="text-gray-600 dark:text-gray-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition font-medium"

            <!-- explore button -->
            <a

              class="text-gray-600 dark:text-gray-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition font-medium nav-link"

            <!-- Theme Toggle Button -->
            <button

            >
              <svg

              >
                <path
                  d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
                ></path>
              </svg>
              <svg
                class="w-5 h-5 text-yellow-500 block dark:hidden"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  fill-rule="evenodd"
                  d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"

          </div>

          <!-- Mobile Menu Button -->
          <div class="flex md:hidden items-center gap-3">
            <button
              id="theme-toggle-mobile"
              class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800/50 hover:bg-gray-300 dark:hover:bg-gray-700/50 transition-colors duration-300"
              aria-label="Toggle theme"
            >
              <svg
                class="w-5 h-5 text-gray-600 dark:text-gray-400 hidden dark:block"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
                ></path>
              </svg>
              <svg
                class="w-5 h-5 text-yellow-500 block dark:hidden"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  fill-rule="evenodd"
                  d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"

                ></path>

            </button>

            <button
              id="mobile-menu-button"
              class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800/50 hover:bg-gray-300 dark:hover:bg-gray-700/50 transition-colors duration-300"
              aria-label="Toggle menu"
            >
              <svg
                id="menu-open-icon"
                class="w-6 h-6 text-gray-900 dark:text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path

                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                ></path>
              </svg>
              <svg
                id="menu-close-icon"
                class="w-6 h-6 text-gray-900 dark:text-white hidden"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                ></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden pt-4 pb-3 space-y-3">
          <a
            href="/"
            class="block px-4 py-2 text-gray-600 dark:text-gray-400 hover:text-cyan-600 dark:hover:text-cyan-400 hover:bg-gray-100 dark:hover:bg-gray-800/50 rounded-lg transition font-medium"
            >Home</a
          >
          <a
            href="/html/team.html"
            class="block px-4 py-2 text-gray-600 dark:text-gray-400 hover:text-cyan-600 dark:hover:text-cyan-400 hover:bg-gray-100 dark:hover:bg-gray-800/50 rounded-lg transition font-medium"
            >Team</a
          >
          <a
            href="/html/explore.html"
            class="block px-4 py-2 text-gray-600 dark:text-gray-400 hover:text-cyan-600 dark:hover:text-cyan-400 hover:bg-gray-100 dark:hover:bg-gray-800/50 rounded-lg transition font-medium"
          >
            Explore
          </a>
        </div>
      </div>
    </nav>

    <!-- 400 Content -->
    <section
      class="min-h-screen flex items-center justify-center px-6 pt-20 relative overflow-hidden"
    >
      <!-- Gradient Orbs -->
      <div
        class="absolute top-1/4 left-1/4 w-96 h-96 bg-yellow-200/40 dark:bg-yellow-500/20 rounded-full blur-3xl transition-colors duration-300 float-animation"
      ></div>
      <div
        class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-amber-200/40 dark:bg-amber-500/20 rounded-full blur-3xl transition-colors duration-300 float-animation"
        style="animation-delay: 1s"
      ></div>

      <div class="max-w-4xl mx-auto text-center relative z-10">
        <!-- 400 Number -->
        <div class="mb-8">
          <h1
            class="text-[180px] md:text-[280px] font-black leading-none bg-gradient-to-r from-yellow-400 via-amber-500 to-orange-500 bg-clip-text text-transparent"
            id="error-code"
          >
            403
          </h1>
        </div>

        <!-- Error Message -->
        <div class="mb-12">
          <h2
            class="text-4xl md:text-6xl font-black mb-6 text-gray-900 dark:text-white transition-colors duration-300"
          >
            Forbidden Access
          </h2>
          <p
            class="text-xl text-gray-600 dark:text-gray-400 mb-4 transition-colors duration-300"
          >
            Oops! You don't have permission to access this resource.
          </p>
          <div
            class="inline-block px-6 py-2 bg-yellow-100 dark:bg-yellow-500/10 border border-yellow-300 dark:border-yellow-500/30 text-yellow-700 dark:text-yellow-400 rounded-full text-sm font-mono transition-colors duration-300"
          >
            <span class="text-yellow-600 dark:text-yellow-300">●</span> Error:
            Forbidden Access
          </div>
        </div>

        <!-- Back Button -->
        <button
          onclick="history.back()"
          class="group inline-flex items-center gap-3 px-8 py-4 bg-gradient-to-r from-yellow-500 to-orange-500 text-white rounded-2xl font-black text-lg hover:shadow-lg hover:shadow-yellow-500/50 transition"
        >
          <svg
            class="w-6 h-6 group-hover:-translate-x-2 transition-transform"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
          GO BACK
        </button>
      </div>
    </section>

    <script>
      // Theme toggle
      const themeToggle = document.getElementById("theme-toggle");
      const themeToggleMobile = document.getElementById("theme-toggle-mobile");
      const htmlElement = document.documentElement;

      const currentTheme = localStorage.getItem("theme") || "dark";
      if (currentTheme === "dark") {
        htmlElement.classList.add("dark");
      } else {
        htmlElement.classList.remove("dark");
      }

      function toggleTheme() {
        htmlElement.classList.toggle("dark");
        const theme = htmlElement.classList.contains("dark") ? "dark" : "light";
        localStorage.setItem("theme", theme);
      }

      themeToggle.addEventListener("click", toggleTheme);
      themeToggleMobile.addEventListener("click", toggleTheme);

      // Mobile menu
      const mobileMenuButton = document.getElementById("mobile-menu-button");
      const mobileMenu = document.getElementById("mobile-menu");
      const menuOpenIcon = document.getElementById("menu-open-icon");
      const menuCloseIcon = document.getElementById("menu-close-icon");

      mobileMenuButton.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
        menuOpenIcon.classList.toggle("hidden");
        menuCloseIcon.classList.toggle("hidden");
      });

      // Glitch effect on 400
      const errorCode = document.getElementById("error-code");
      setInterval(() => {
        errorCode.classList.add("glitch");
        setTimeout(() => {
          errorCode.classList.remove("glitch");
        }, 300);
      }, 3000);
    </script>
  </body>
</html>
