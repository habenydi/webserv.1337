
server {

    listen 8080;
    server_name localhost;

    root ./www/;
    index index.html;
    error_page 404 /html/error/404.html;
    error_page 400 /html/error/400.html;
    error_page 500 /html/error/500.html;
    error_page 405 /html/error/405.html;

    client_max_body_size 1000000;

    location / {
        root ./www/html;
        autoindex off;
    }

    Cgi_Interpreter .py /usr/bin/python3
    Cgi_Interpreter .pl /usr/bin/perl
    Cgi_Interpreter .sh /usr/bin/sh
}
