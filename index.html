<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under Maintenance</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        overflow: hidden;
      }

      .maintenance-container {
        text-align: center;
        padding: 2rem;
        animation: fadeIn 1s ease-in;
      }

      .maintenance-content {
        background: rgba(30, 30, 46, 0.4);
        backdrop-filter: blur(10px);
        padding: 4rem 3rem;
        border-radius: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .maintenance-title {
        font-size: 4.5rem;
        font-weight: 900;
        color: #ffffff;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        animation: slideDown 0.8s ease-out;
      }

      .maintenance-message {
        font-size: 1.5rem;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 300;
        letter-spacing: 1px;
        animation: slideUp 0.8s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideDown {
        from {
          transform: translateY(-30px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes slideUp {
        from {
          transform: translateY(30px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @media (max-width: 768px) {
        .maintenance-title {
          font-size: 3rem;
        }

        .maintenance-message {
          font-size: 1.2rem;
        }

        .maintenance-content {
          padding: 3rem 2rem;
        }
      }

      @media (max-width: 480px) {
        .maintenance-title {
          font-size: 2rem;
        }

        .maintenance-message {
          font-size: 1rem;
        }

        .maintenance-content {
          padding: 2rem 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="maintenance-container">
      <div class="maintenance-content">
        <h1 class="maintenance-title">Under Maintenance</h1>
        <p class="maintenance-message">We'll be back shortly</p>
      </div>
    </div>
  </body>
</html>
